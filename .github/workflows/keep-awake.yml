# 公開しているアプリ（Render の無料プラン）が休まないように、定期的に軽くアクセスする。
# 無料枠（月750時間）を使い切らないよう、日本時間の 6時〜翌2時 だけ起こしておく（夜中は休ませる）。
# GitHub の定期実行は数分遅れることがあるので、5分ごとにしている（Render は15分アクセスがないと休む）。
name: keep-awake

on:
  schedule:
    # UTC で書く。日本時間 6:00〜翌1:59 ＝ UTC 21:00〜翌16:59
    - cron: "*/5 0-16,21-23 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: アプリにアクセス
        run: curl -fsS --max-time 90 --retry 2 https://muscle-quest.onrender.com/api/version || true
